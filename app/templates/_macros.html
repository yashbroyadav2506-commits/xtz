{% macro csrf_field() -%}
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
{%- endmacro %}

{% macro render_field(field, class_name="form-control") -%}
  <div class="mb-3">
    {{ field.label(class="form-label fw-semibold") }}
    {{ field(class=class_name, **kwargs) }}
    {% if field.errors %}<div class="text-danger small mt-1">{{ field.errors[0] }}</div>{% endif %}
  </div>
{%- endmacro %}
